name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          uv run pytest tests/e2e -m e2e \
            --browser chromium \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --output=test-results \
            --junitxml=test-results/junit.xml \
            -v

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/junit.xml
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload test summary
        if: always()
        run: |
          if [ -f test-results/junit.xml ]; then
            echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            xq -r '.testsuite | "\(.tests) tests, \(.failures) failures, \(.errors) errors, \(.skipped) skipped, \(.time)s"' test-results/junit.xml >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi