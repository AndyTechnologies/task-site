[project]
name = "tasksite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AndyTechnologies", email = "garciandy579@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django[argon2]>=6.1.3",
    "markdown-it-py>=4.3.0",
    "nh3>=0.3.8",
]

[project.scripts]
tasksite = "tasksite:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "e2e: marks tests as end-to-end browser tests",
    "slow: marks tests as slow running",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
console_output_style = "progress"
